yaml
name: crawl
on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m petcompare.cli crawl
      - uses: actions/upload-artifact@v4
        with:
          name: petcompare-db
          path: petcompare.db
